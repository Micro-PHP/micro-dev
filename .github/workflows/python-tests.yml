name: Python Tests

on:
  push:
    branches:
      - '2.x-dev'
      - '2.x'
  pull_request:
    branches:
      - '2.x-dev'
      - '2.x'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/python
